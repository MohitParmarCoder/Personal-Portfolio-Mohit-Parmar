name: Deploy to GitHub Pages

# The push trigger is deliberately commented out: the site is meant to stay
# unpublished, and an automatic deploy on every merge would put it back. Run
# the workflow by hand from the Actions tab to publish again, or restore the
# push trigger to go back to deploying on merge.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued run finish rather than
# cancelling it so the published site always matches the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Reads the existing Pages configuration. It cannot create the Pages site:
      # the action's `enablement` input requires a token other than
      # GITHUB_TOKEN, so Pages must be turned on once in repository settings.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
