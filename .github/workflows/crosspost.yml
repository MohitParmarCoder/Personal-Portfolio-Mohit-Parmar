name: Cross-post new articles

# Mirrors new posts to dev.to and Hashnode with canonical URLs pointing at the
# portfolio. Waits on nothing: the deploy workflow publishes the site in
# parallel, and both platforms fetch canonicals lazily.
on:
  push:
    branches: [main]
    paths: ['posts/**']
  workflow_dispatch:

permissions:
  contents: write

# One at a time, queued — two overlapping runs could both see a post as
# unpublished before either records it.
concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The state-file commit below needs to push back to main.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/crosspost.mjs
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}

      # Persist the published-article IDs so future runs never double-post.
      # [skip ci] keeps this bookkeeping commit from triggering a deploy.
      - name: Save cross-post state
        run: |
          if git diff --quiet .crosspost.json 2>/dev/null && [ -f .crosspost.json ]; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .crosspost.json
          git commit -m "Record cross-posted article IDs [skip ci]" || exit 0
          git push
